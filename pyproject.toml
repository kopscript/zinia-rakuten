[project]
name = "zinia-rakuten"
version = "0.1.0"
description = "紫鸟浏览器自动化操作乐天店铺"
requires-python = ">=3.10"
authors = [{ name = "hlwd" }]
license = { text = "MIT" }
dependencies = [
    "selenium>=4.10",
    "pyyaml>=6.0",
    "typer>=0.9",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
zinia-rakuten = "zinia_rakuten.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zinia_rakuten"]
